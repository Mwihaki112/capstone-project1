services:
  - type: web
    name: bloodlink-api
    runtime: python
    rootDir: Backend

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: bloodlink-frontend
    runtime: static
    rootDir: Frontend

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false